<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="pdfdruck.js" defer></script>
<title>Montage-Etiketten</title>
<style>
:root{--ink:#1b2331;--muted:#5d6879;--line:#d6dce6;--paper:#f3f5f8;--surface:#fff;--indigo:#2d4a8a;--accent:#c2560f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px))}
.bar h1{font-size:1.05rem;margin:0 auto 0 0}
.bar select,.bar button,.bar a{font:inherit;font-size:.92rem;border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:var(--surface);color:var(--ink);text-decoration:none}
.bar button.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}
.bar label{display:flex;gap:6px;align-items:center;font-size:.92rem}
.hint{color:var(--muted);font-size:.85rem;padding:8px max(16px,env(safe-area-inset-left,0px)) 0}
.sheet{display:flex;flex-wrap:wrap;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.lbl{background:#fff;color:#000;width:var(--w);height:var(--h);padding:2.5mm 3mm;display:flex;gap:2.5mm;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.18);border-radius:2mm;font-size:calc(var(--s) * 8.5pt);line-height:1.22;max-width:100%}
.lbl .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:.35mm}
.lbl .kd{font-size:1.75em;font-weight:800;line-height:1.08;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lbl .top{font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl.hoch{flex-direction:column;padding:5mm 5mm 4mm;gap:4mm}
.lbl.hoch .tx{gap:1.4mm;flex:1 1 auto;min-height:0;overflow:hidden}
.lbl.hoch .qrw{flex:0 0 auto}
.lbl.hoch .kd{font-size:2.3em;-webkit-line-clamp:3;padding-bottom:2mm;border-bottom:.5mm solid #000;margin-bottom:1mm}
.lbl.hoch .pos{font-size:1.5em}
.lbl.hoch .mt{font-size:1.5em}.lbl.hoch .anz{font-size:1.45em}
.lbl.hoch .ln{white-space:normal}
.lbl.hoch .qrw{flex-direction:row;align-items:flex-end;gap:3mm;margin-top:auto}
.lbl.hoch .qrw small{max-width:30mm}
.lbl .pos{font-size:1.35em;font-weight:800;line-height:1.1;min-width:0}
.lbl .pr{display:flex;align-items:center;gap:2mm}
.lbl .ber{flex:0 0 auto;border:.7mm solid #000;border-radius:1.2mm;padding:.3mm 2mm .6mm;font-size:1.9em;font-weight:900;line-height:1;text-align:center}
.lbl .ber small{display:block;font-size:.3em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.4mm}
.lbl.hoch .ber{font-size:2.3em;border-width:.9mm}
.lbl .sch{display:inline-block;align-self:flex-start;border:.5mm solid #000;color:#000;font-weight:800;padding:0 1.6mm;border-radius:1mm;font-size:1.1em}
.lbl .mt{display:grid;grid-template-columns:auto 1fr;column-gap:2.5mm;align-items:baseline;font-size:1.18em;line-height:1.15}
.lbl .mt span{font-size:.72em;color:#333;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.lbl .mt b{font-weight:800}
.lbl .anz{font-size:1.18em}.lbl .anz b{font-weight:900}.lbl .anz span{font-size:.8em}
.lbl .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .qrw{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.lbl .qrw svg{width:var(--q);height:var(--q)}
.lbl .qrw small{font-size:.75em;color:#333}
.lbl.klein .opt{display:none}
.empty{padding:30px 16px;color:var(--muted)}
@media print{
  body{background:#fff}
  .bar,.hint{display:none}
  .sheet{display:block;padding:0}
  .lbl{box-shadow:none;border-radius:0;page-break-after:always;break-after:page;margin:0}
  .sheet.bogen{display:grid;grid-template-columns:105mm 105mm;grid-auto-rows:74mm}
  .sheet.bogen .lbl{page-break-after:auto;break-after:auto;border:0}
  .sheet.bogen .lbl:nth-child(8n){break-after:page;page-break-after:always}
}
</style>
</head>
<body>
<div class="bar">
  <h1>Montage-Etiketten</h1>
  <select id="size" aria-label="Etikettengröße"></select>
  <label><input type="checkbox" id="perSchal" checked> je Schal ein Etikett</label>
  <button class="primary" id="print" type="button">Drucken</button>
  <a id="back" href="index.html">← zur App</a>
</div>
<div class="hint" id="hint"></div>
<div class="sheet" id="sheet"></div>
<script>
/* QR-Code (Byte-Modus, Fehlerkorrektur M) – ohne Zusatzbibliothek */
const QR=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const rawMod=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36;}return r;};
  const dataCw=v=>Math.floor(rawMod(v)/8)-ECC[v]*BLK[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;};
  const divisor=d=>{const r=new Array(d-1).fill(0).concat([1]);let root=1;for(let i=0;i<d;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1];}root=mul(root,2);}return r;};
  const rem=(data,div)=>{const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f));}return r;};
  const alignPos=(v,size)=>{if(v===1)return [];const na=Math.floor(v/7)+2,step=v===32?26:Math.floor((v*4+na*2+1)/(na*2-2))*2;const r=[6];let p=size-7;for(let i=0;i<na-1;i++){r.splice(1,0,p);p-=step;}return r;};
  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  function matrix(text){
    const data=new TextEncoder().encode(text);let ver=0;
    for(let v=1;v<=40;v++){if(4+(v<10?8:16)+data.length*8<=dataCw(v)*8){ver=v;break;}}
    if(!ver)throw new Error('Text zu lang für einen QR-Code');
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
    put(4,4);put(data.length,ver<10?8:16);data.forEach(b=>put(b,8));
    const cap=dataCw(ver)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let pad=0xEC;bits.length<cap;pad^=0xEC^0x11)put(pad,8);
    const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];cw.push(b);}
    const nb=BLK[ver],ecl=ECC[ver],raw=Math.floor(rawMod(ver)/8),nshort=nb-raw%nb,slen=Math.floor(raw/nb),div=divisor(ecl);
    const blocks=[];let k=0;
    for(let i=0;i<nb;i++){let dat=cw.slice(k,k+slen-ecl+(i<nshort?0:1));k+=dat.length;const ecc=rem(dat,div);if(i<nshort)dat=dat.concat([0]);blocks.push(dat.concat(ecc));}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==slen-ecl||j>=nshort)all.push(b[i]);});
    const size=ver*4+17,M=[...Array(size)].map(()=>new Array(size).fill(false)),F=[...Array(size)].map(()=>new Array(size).fill(false));
    const setf=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<size;i++){setf(6,i,i%2===0);setf(i,6,i%2===0);}
    for(const [cx,cy] of [[3,3],[size-4,3],[3,size-4]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const d=Math.max(Math.abs(dx),Math.abs(dy));setf(xx,yy,d!==2&&d!==4);}}
    const ap=alignPos(ver,size);
    ap.forEach((ax,i)=>ap.forEach((ay,j)=>{if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0))return;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setf(ax+dx,ay+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}));
    const drawFormat=mask=>{const d=mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
      for(let i=0;i<6;i++)setf(8,i,g(i));setf(8,7,g(6));setf(8,8,g(7));setf(7,8,g(8));for(let i=9;i<15;i++)setf(14-i,8,g(i));
      for(let i=0;i<8;i++)setf(size-1-i,8,g(i));for(let i=8;i<15;i++)setf(8,size-15+i,g(i));setf(8,size-8,true);};
    drawFormat(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)===1,a=size-11+i%3,c=Math.floor(i/3);setf(a,c,bit);setf(c,a,bit);}}
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
      if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)===1;i++;}}}
    const apply=mk=>{const f=MASKS[mk];for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&f(x,y))M[y][x]=!M[y][x];};
    const penalty=()=>{let p=0;const lines=[];for(let y=0;y<size;y++)lines.push(M[y]);for(let x=0;x<size;x++)lines.push(M.map(r=>r[x]));
      for(const line of lines){let run=0,last=null;for(const v of line){if(v===last)run++;else{if(run>=5)p+=run-2;run=1;last=v;}}if(run>=5)p+=run-2;
        const s=line.map(v=>v?'1':'0').join('');p+=40*((s.split('10111010000').length-1)+(s.split('00001011101').length-1));}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
      let dark=0;M.forEach(r=>r.forEach(v=>{if(v)dark++;}));const tot=size*size;p+=Math.floor(Math.abs(dark*20-tot*10)/tot)*10;return p;};
    let best=0,bp=null;for(let mk=0;mk<8;mk++){apply(mk);drawFormat(mk);const pn=penalty();if(bp===null||pn<bp){best=mk;bp=pn;}apply(mk);}
    apply(best);drawFormat(best);return M;}
  function svg(text,mm,color){const M=matrix(text),n=M.length,s=n+8;let d='';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(M[y][x])d+='M'+(x+4)+' '+(y+4)+'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+s+' '+s+'"'+(mm?' width="'+mm+'mm" height="'+mm+'mm"':'')+' shape-rendering="crispEdges" class="qr"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="'+(color||'#000')+'"/></svg>';}
  return {matrix,svg};
})();

const EMBED=/*DATA*/null;
const SIZES=[['102x156','Etikett 102 × 156 mm (hoch)',102,156],['100x62','Brother 62 mm Endlos (100 × 62 mm)',100,62],['89x36','Dymo 99012 (89 × 36 mm)',89,36],['101x54','Dymo 99014 (101 × 54 mm)',101,54],
  ['100x50','Etikett 100 × 50 mm',100,50],['a4','A4-Bogen 2 × 4 (105 × 74 mm)',105,74]];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=x=>String(x).replace('.',',');
const b64u=s=>{const by=new TextEncoder().encode(s);let bin='';by.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder().decode(by);};
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem('etikett.'+k);localStorage.setItem('etikett.'+k,v);}catch(e){return null;}};
let base='',list=[];
try{
  if(EMBED){list=EMBED.l||[];base=EMBED.u||'';document.getElementById('back').hidden=true;}
  else{const h=location.hash.slice(1);base=location.href.split('#')[0];
    if(h.startsWith('L'))list=JSON.parse(unb64u(h.slice(1)));else if(h)list=[JSON.parse(unb64u(h))];}
}catch(e){list=[];}
const sizeSel=document.getElementById('size');
SIZES.forEach(([id,t])=>sizeSel.insertAdjacentHTML('beforeend','<option value="'+id+'">'+t+'</option>'));
sizeSel.value=(EMBED&&EMBED.size)||store('size')||'102x156';
if(!sizeSel.value)sizeSel.value='102x156';
document.getElementById('perSchal').checked=store('perSchal')!=='0';
function seiten(n){return n===2?['links','rechts']:n===1?['']:Array.from({length:n},(_,i)=>'Schal '+(i+1)+' von '+n);}
function etikettTextPlain(o){const f=x=>String(x).replace('.',','),s=o.s||1;
  return ['Kunde: '+(o.k||''),o.a&&('Auftrag: '+o.a),o.e&&('Bereich: '+o.e),'Pos. '+o.p+': '+(o.t||''),o.w&&('Deckbreite '+f(o.w)+' cm'),o.h&&('Fertighöhe '+f(o.h)+' cm'),
    s+(s===1?' Schal':' Schals')+(o.b?' je '+f(o.b)+' cm breit':''),(o.q||1)>1&&(o.q+' Stück'),o.ma&&('Montage an: '+o.ma),o.g&&('Gleiter: '+o.g),o.m&&('Montage: '+o.m),o.r&&('Bem.: '+o.r)].filter(Boolean).join('\n');}
function qrText(o){return base?base+'#'+b64u(JSON.stringify(o)):etikettTextPlain(o);}
function labelHtml(o,schal,stueck,sz){
  const [,,w,h]=sz,hoch=h>w,s=hoch?w/100*1.45:Math.min(h/62,1.15),q=hoch?Math.min(w*0.36,h*0.25):Math.min(h-6,w*0.34,34);
  const sch=(schal!=null?(o.s===2?(schal===0?'◀ links':'rechts ▶'):(o.s>2?'Schal '+(schal+1)+' von '+o.s:'')):'')+(stueck?(schal!=null&&o.s>1?' · ':'')+'Stück '+stueck:'');
  return '<div class="lbl'+(h<45?' klein':'')+(hoch?' hoch':'')+'" style="--w:'+w+'mm;--h:'+h+'mm;--s:'+s+';--q:'+q+'mm"><div class="tx">'+
    '<div class="kd">'+esc(o.k||'—')+'</div>'+(o.a?'<div class="top">Auftrag '+esc(o.a)+'</div>':'')+
    '<div class="pr">'+(o.e?'<div class="ber"><small>Bereich</small>'+esc(o.e)+'</div>':'')+'<div class="pos">Pos. '+esc(o.p)+(o.t?' · '+esc(o.t):'')+'</div></div>'+
    (sch?'<div class="sch">'+esc(sch)+'</div>':'')+
    '<div class="mt">'+(o.w?'<span>Deckbreite</span><b>'+fmt(o.w)+' cm</b>':'')+(o.h?'<span>Fertighöhe</span><b>'+fmt(o.h)+' cm</b>':'')+'</div>'+
    '<div class="anz"><b>'+o.s+(o.s===1?' Schal':' Schals')+'</b>'+(o.b?' <span>je '+fmt(o.b)+' cm breit</span>':'')+(o.q>1?' <b>· '+o.q+' Stück</b>':'')+'</div>'+
    (o.ma?'<div class="ln"><b>Montage an: '+esc(o.ma)+'</b></div>':'')+
    (o.g?'<div class="ln">Gleiter: '+esc(o.g)+'</div>':'')+
    (o.m?'<div class="ln"><b>Montage: '+esc(o.m)+'</b></div>':'')+
    (o.st||o.bd?'<div class="ln opt">'+esc([o.st,o.bd].filter(Boolean).join(' · '))+'</div>':'')+
    (o.r?'<div class="ln opt">Bem.: '+esc(o.r)+'</div>':'')+
    '</div><div class="qrw">'+QR.svg(qrText(o))+(hoch?'<small>Scannen für alle Angaben zu dieser Position</small>':'')+'</div></div>';}
function render(){
  const sz=SIZES.find(x=>x[0]===sizeSel.value)||SIZES[0],per=document.getElementById('perSchal').checked,sheet=document.getElementById('sheet');
  document.getElementById('pg')?.remove();
  document.head.insertAdjacentHTML('beforeend','<style id="pg">@page{size:'+(sz[0]==='a4'?'A4 portrait':sz[2]+'mm '+sz[3]+'mm')+';margin:0}</style>');
  sheet.classList.toggle('bogen',sz[0]==='a4');
  if(!list.length){sheet.innerHTML='<div class="empty">Kein Etikett gefunden. Bitte den QR-Code auf dem Nähzettel scannen.</div>';document.getElementById('hint').textContent='';return;}
  let h='',n=0;
  for(const o of list){const q=Math.max(1,o.q||1);
    for(let st=1;st<=q;st++){if(per&&o.s>1)for(let i=0;i<o.s;i++){h+=labelHtml(o,i,q>1?st+'/'+q:'',sz);n++;}
      else{h+=labelHtml(o,per?0:null,q>1?st+'/'+q:'',sz);n++;}}}
  sheet.innerHTML=h;
  document.getElementById('hint').textContent=n+(n===1?' Etikett':' Etiketten')+' · Beim Drucken im Druckdialog das Papierformat „'+sz[1]+'“ und „Ohne Rand“ bzw. Skalierung 100 % wählen.';}
sizeSel.onchange=()=>{store('size',sizeSel.value);render();};
document.getElementById('perSchal').onchange=e=>{store('perSchal',e.target.checked?'1':'0');render();};
document.getElementById('print').onclick=()=>{if(!window.VBDruck||!VBDruck.needsPdf()){window.print();return;}
  const sz=SIZES.find(x=>x[0]===sizeSel.value)||SIZES[0],sh=document.getElementById('sheet');
  VBDruck.print(sz[0]==='a4'?{root:sh,name:'Montage-Etiketten',pageW:210,pageH:297,margin:0,widthPx:794,avoid:'.lbl'}:{root:sh,pages:'.lbl',pageW:sz[2],pageH:sz[3],name:'Montage-Etiketten'}).catch(()=>{});};
window.addEventListener('hashchange',()=>location.reload());
render();
</script>
</body>
</html>
